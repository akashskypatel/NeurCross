name: Clean notebook training dashboard

on:
  push:
    branches:
      - agent/clean-notebook-progress

permissions:
  contents: write

jobs:
  update-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-notebook-progress

      - name: Update and validate notebook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/clean_notebook_progress.py')
          source = path.read_text(encoding='utf-8')
          old = '"process_sources()\\n"'
          if old not in source:
              raise RuntimeError('process_sources rewrite anchor not found')
          path.write_text(source.replace(old, '"process_sources()"', 1), encoding='utf-8')
          PY
          python .github/clean_notebook_progress.py

      - name: Remove temporary updater and commit
        shell: bash
        run: |
          rm .github/clean_notebook_progress.py
          rm .github/workflows/clean-notebook-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NeurCross_Training.ipynb .github/clean_notebook_progress.py .github/workflows/clean-notebook-progress.yml
          git commit -m "Clean up notebook training progress output"
          git push origin HEAD:agent/clean-notebook-progress
