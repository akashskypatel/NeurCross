name: Clean notebook training dashboard

on:
  push:
    branches:
      - agent/clean-notebook-progress

permissions:
  contents: write

jobs:
  update-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-notebook-progress

      - name: Update and validate notebook
        run: python .github/clean_notebook_progress.py

      - name: Remove temporary updater and commit
        shell: bash
        run: |
          rm .github/clean_notebook_progress.py
          rm .github/workflows/clean-notebook-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NeurCross_Training.ipynb .github/clean_notebook_progress.py .github/workflows/clean-notebook-progress.yml
          git commit -m "Clean up notebook training progress output"
          git push origin HEAD:agent/clean-notebook-progress
