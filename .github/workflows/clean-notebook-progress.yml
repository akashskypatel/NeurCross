name: Clean notebook training dashboard

on:
  push:
    branches:
      - agent/clean-notebook-progress

permissions:
  contents: write

jobs:
  update-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-notebook-progress

      - name: Update notebook dashboard and quiet logging
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          notebook_path = Path("NeurCross_Training.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))

          dashboard_cell = None
          for cell in notebook["cells"]:
              if cell.get("cell_type") != "code":
                  continue
              source = "".join(cell.get("source", []))
              if "class NotebookTrainingDashboard" in source:
                  dashboard_cell = cell
                  break
          if dashboard_cell is None:
              raise RuntimeError("NotebookTrainingDashboard cell not found")

          source = "".join(dashboard_cell["source"])

          import_anchor = "import base64\n"
          import_replacement = (
              "import base64\n"
              "from contextlib import contextmanager, redirect_stderr, redirect_stdout\n"
          )
          if import_replacement not in source:
              if import_anchor not in source:
                  raise RuntimeError("base64 import anchor not found")
              source = source.replace(import_anchor, import_replacement, 1)

          hf_anchor = "from huggingface_hub.errors import HfHubHTTPError\n"
          hf_replacement = (
              "from huggingface_hub.errors import HfHubHTTPError\n"
              "from huggingface_hub.utils import disable_progress_bars\n"
          )
          if hf_replacement not in source:
              if hf_anchor not in source:
                  raise RuntimeError("huggingface import anchor not found")
              source = source.replace(hf_anchor, hf_replacement, 1)

          quiet_anchor = "NOTEBOOK_OUTPUT_LOCK = threading.RLock()\n\n\n"
          quiet_block = '''NOTEBOOK_OUTPUT_LOCK = threading.RLock()
NOTEBOOK_QUIET_OUTPUT = True
_NOTEBOOK_IMPORTANT_LOG_RE = re.compile(
    r"(?:\\berror\\b|\\bfailed\\b|\\bfailure\\b|\\bexception\\b|traceback|"
    r"out of memory|timed out|could not|\\bwarning\\b)",
    re.IGNORECASE,
)
_NOTEBOOK_RETRY_NOISE_RE = re.compile(
    r"(?:retrying|retry \\d+/\\d+|sleeping .*? before retry)",
    re.IGNORECASE,
)


def _notebook_line_is_important(line: str) -> bool:
    text = _ANSI_ESCAPE_RE.sub("", str(line)).strip()
    return bool(
        text
        and _NOTEBOOK_IMPORTANT_LOG_RE.search(text)
        and not _NOTEBOOK_RETRY_NOISE_RE.search(text)
    )


class _NotebookFilteredStream:
    def __init__(self, stream):
        self.stream = stream
        self._buffer = ""
        self._lock = threading.RLock()

    def write(self, text):
        if not text:
            return 0
        with self._lock:
            self._buffer += str(text).replace("\\r", "\\n")
            parts = self._buffer.split("\\n")
            self._buffer = parts.pop()
            for line in parts:
                if _notebook_line_is_important(line):
                    self.stream.write(_ANSI_ESCAPE_RE.sub("", line).rstrip() + "\\n")
            self.stream.flush()
        return len(text)

    def flush(self):
        with self._lock:
            if self._buffer and _notebook_line_is_important(self._buffer):
                self.stream.write(_ANSI_ESCAPE_RE.sub("", self._buffer).rstrip() + "\\n")
                self._buffer = ""
            self.stream.flush()

    def isatty(self):
        return False


@contextmanager
def quiet_notebook_output():
    if not NOTEBOOK_QUIET_OUTPUT:
        yield
        return
    stdout_filter = _NotebookFilteredStream(sys.stdout)
    stderr_filter = _NotebookFilteredStream(sys.stderr)
    with redirect_stdout(stdout_filter), redirect_stderr(stderr_filter):
        yield
    stdout_filter.flush()
    stderr_filter.flush()


def notebook_print(*args, **kwargs) -> None:
    with NOTEBOOK_OUTPUT_LOCK:
        print(*args, **kwargs)


def _child_status_message(fragment: str) -> str | None:
    text = str(fragment).strip()
    lowered = text.lower()
    if "dataset-label training failed" in lowered or "out of memory" in lowered:
        return "failed"
    if "training stopped early" in lowered:
        return "early stop · packaging"
    if "training finished" in lowered:
        return "packaging"
    if "validation:" in lowered:
        return "validating"
    if "mesh preflight:" in lowered:
        return "mesh ready"
    if (
        "training device:" in lowered
        or "training schedule:" in lowered
        or "decoder initialising" in lowered
    ):
        return "initializing"
    if "early stopping enabled:" in lowered or "curriculum stage:" in lowered:
        return "training"
    return None


'''
          if "class _NotebookFilteredStream" not in source:
              if quiet_anchor not in source:
                  raise RuntimeError("notebook output lock anchor not found")
              source = source.replace(quiet_anchor, quiet_block, 1)

          html_start = source.index("    def _html_locked(self) -> str:\n")
          html_end = source.index("    def _render_locked", html_start)
          html_method = '''    def _html_locked(self) -> str:
        source_value = str(self._source_id or "waiting for source")
        source_label = source_value.split(":", 1)[-1]
        cards = []
        for device in sorted(self._states, key=_device_sort_key):
            state = self._states[device]
            percent = max(0, min(100, int(state.get("percent", 0))))
            step = int(state.get("step", 0))
            total = int(state.get("total", 0))
            epoch = int(state.get("epoch", 0))
            loss = state.get("loss")
            loss_text = "—" if loss is None else f"{float(loss):.5f}"
            sample_value = str(state.get("sample_id") or "idle")
            status_value = str(state.get("status") or "idle")
            identity_value = str(state.get("identity") or "")
            pid_match = re.search(r"\\bpid=(\\d+)", identity_value)
            pid_text = f"PID {pid_match.group(1)}" if pid_match else ""
            updated_text = str(state.get("updated_at") or "")
            step_text = f"{step:,} / {total:,}" if total > 0 else "—"
            status_lower = status_value.lower()
            if "fail" in status_lower or "error" in status_lower:
                status_class = "nc-status nc-status-bad"
            elif status_lower in {"idle", "waiting"}:
                status_class = "nc-status nc-status-idle"
            elif "complete" in status_lower or status_lower in {"completed", "accepted"}:
                status_class = "nc-status nc-status-good"
            else:
                status_class = "nc-status nc-status-active"
            cards.append(
                "<div class='nc-card'>"
                "<div class='nc-card-head'>"
                f"<span class='nc-device'>{escape(device)}</span>"
                f"<span class='nc-sample' title='{escape(sample_value)}'>{escape(sample_value)}</span>"
                f"<span class='{status_class}'>{escape(status_value)}</span>"
                "</div>"
                "<div class='nc-progress-line'>"
                "<div class='nc-progress-track'>"
                f"<div class='nc-progress-fill' style='width:{percent}%'></div>"
                "</div>"
                f"<strong class='nc-percent'>{percent}%</strong>"
                "</div>"
                "<div class='nc-meta'>"
                f"<span><b>Step</b> {escape(step_text)}</span>"
                f"<span><b>Epoch</b> {epoch}</span>"
                f"<span><b>Loss</b> {loss_text}</span>"
                f"<span>{escape(pid_text)}</span>"
                f"<span>{escape(updated_text)}</span>"
                "</div>"
                "</div>"
            )
        cards_html = "".join(cards) or "<div class='nc-empty'>No training devices detected.</div>"
        return (
            "<style>"
            ".nc-dashboard{font-family:var(--jp-ui-font-family,system-ui,sans-serif);color:var(--jp-ui-font-color1,inherit);max-width:980px}"
            ".nc-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}"
            ".nc-title strong{font-size:15px}"
            ".nc-source{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--jp-ui-font-color2,#777);font-size:12px}"
            ".nc-grid{display:grid;gap:8px}"
            ".nc-card{border:1px solid var(--jp-border-color2,rgba(127,127,127,.28));border-radius:8px;padding:10px 12px;background:var(--jp-layout-color1,rgba(127,127,127,.04))}"
            ".nc-card-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin-bottom:8px}"
            ".nc-device{font-weight:700;font-size:13px}"
            ".nc-sample{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--jp-code-font-family,monospace);font-size:12px}"
            ".nc-status{border-radius:999px;padding:2px 8px;font-size:11px;white-space:nowrap}"
            ".nc-status-active{background:rgba(63,127,255,.16)}"
            ".nc-status-good{background:rgba(45,160,90,.18)}"
            ".nc-status-bad{background:rgba(220,70,70,.18)}"
            ".nc-status-idle{background:rgba(127,127,127,.14)}"
            ".nc-progress-line{display:grid;grid-template-columns:minmax(0,1fr) 42px;align-items:center;gap:10px}"
            ".nc-progress-track{height:9px;border-radius:999px;overflow:hidden;background:var(--jp-layout-color3,rgba(127,127,127,.22))}"
            ".nc-progress-fill{height:100%;border-radius:999px;background:var(--jp-brand-color1,#4c8bf5);transition:width .18s ease}"
            ".nc-percent{text-align:right;font-size:12px}"
            ".nc-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:7px;color:var(--jp-ui-font-color2,#777);font-size:11px}"
            ".nc-meta b{color:var(--jp-ui-font-color1,inherit);font-weight:600}"
            ".nc-empty{padding:10px;color:var(--jp-ui-font-color2,#777)}"
            "@media(max-width:620px){.nc-card-head{grid-template-columns:auto minmax(0,1fr)}.nc-status{grid-column:1/-1;width:max-content}.nc-meta{gap:8px 14px}}"
            "</style>"
            "<div class='nc-dashboard'>"
            "<div class='nc-title'>"
            "<strong>NeurCross training</strong>"
            f"<span class='nc-source' title='{escape(source_value)}'>{escape(source_label)}</span>"
            "</div>"
            f"<div class='nc-grid'>{cards_html}</div>"
            "</div>"
        )

'''
          source = source[:html_start] + html_method + source[html_end:]

          command_lines = (
              '    notebook_print(f"[{device_label}] Running command:", flush=True)\n'
              '    notebook_print(f"[{device_label}] {\' \'.join(cmd)}", flush=True)\n'
          )
          command_replacement = (
              '    if progress_device is not None:\n'
              '        NOTEBOOK_TRAINING_DASHBOARD.set_status(progress_device, sample_label, "launching")\n'
          )
          if command_lines in source:
              source = source.replace(command_lines, command_replacement, 1)
          elif "Running command:" in source:
              raise RuntimeError("command logging block changed unexpectedly")

          consume_old = '''        if identity_match and identity_match.group(0) == fragment:
            return
        if progress_device is not None:
            NOTEBOOK_TRAINING_DASHBOARD.set_status(progress_device, sample_label, fragment)
        notebook_print(f"[{device_label}] {fragment}", flush=True)
'''
          consume_new = '''        if identity_match and identity_match.group(0) == fragment:
            return
        status_message = _child_status_message(fragment)
        if status_message and progress_device is not None:
            NOTEBOOK_TRAINING_DASHBOARD.set_status(progress_device, sample_label, status_message)
        if _notebook_line_is_important(fragment):
            notebook_print(f"[{device_label}] {_ANSI_ESCAPE_RE.sub('', fragment)}", flush=True)
'''
          if consume_old not in source:
              raise RuntimeError("child output block not found")
          source = source.replace(consume_old, consume_new, 1)

          hf_progress_anchor = 'NOTEBOOK_TRAINING_DASHBOARD = NotebookTrainingDashboard()\n\nNEURCROSS_MODULE = "neurcross"\n'
          hf_progress_replacement = (
              'NOTEBOOK_TRAINING_DASHBOARD = NotebookTrainingDashboard()\n\n'
              'os.environ.setdefault("HF_HUB_DISABLE_PROGRESS_BARS", "1")\n'
              'os.environ.setdefault("TQDM_DISABLE", "1")\n'
              'disable_progress_bars()\n\n'
              'NEURCROSS_MODULE = "neurcross"\n'
          )
          if hf_progress_replacement not in source:
              if hf_progress_anchor not in source:
                  raise RuntimeError("dashboard initialization anchor not found")
              source = source.replace(hf_progress_anchor, hf_progress_replacement, 1)

          dashboard_cell["source"] = source.splitlines(keepends=True)

          run_cell = None
          for cell in notebook["cells"]:
              if cell.get("cell_type") != "code":
                  continue
              cell_source = "".join(cell.get("source", []))
              if "process_sources()" in cell_source and "Execute one or more resumable" in cell_source:
                  run_cell = cell
                  break
          if run_cell is None:
              raise RuntimeError("process_sources execution cell not found")
          run_source = "".join(run_cell["source"])
          run_source = run_source.replace(
              "process_sources()\n",
              "with quiet_notebook_output():\n    process_sources()\n",
              1,
          )
          run_cell["source"] = run_source.splitlines(keepends=True)

          notebook_path.write_text(json.dumps(notebook, indent=1) + "\n", encoding="utf-8")

          reloaded = json.loads(notebook_path.read_text(encoding="utf-8"))
          modified_source = "".join(dashboard_cell["source"])
          ast.parse(modified_source)
          ast.parse("".join(run_cell["source"]))
          assert "class _NotebookFilteredStream" in modified_source
          assert "nc-progress-track" in modified_source
          assert "<table" not in modified_source[modified_source.index("    def _html_locked"):modified_source.index("    def _render_locked")]
          assert 'set_status(progress_device, sample_label, fragment)' not in modified_source
          assert 'Running command:' not in modified_source
          assert "with quiet_notebook_output():" in "".join(run_cell["source"])
          assert len(reloaded["cells"]) == len(notebook["cells"])
          print("Notebook JSON, syntax, compact dashboard, quiet stream, and integration markers verified.")
          PY

      - name: Remove temporary updater and commit
        shell: bash
        run: |
          rm .github/workflows/clean-notebook-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NeurCross_Training.ipynb .github/workflows/clean-notebook-progress.yml
          git commit -m "Clean up notebook training progress output"
          git push origin HEAD:agent/clean-notebook-progress
