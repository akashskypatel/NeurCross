name: Remove duplicate notebook helper

on:
  push:
    branches:
      - agent/clean-notebook-progress

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-notebook-progress

      - name: Remove duplicate helper and validate
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path('NeurCross_Training.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          target = next(
              cell for cell in notebook['cells']
              if cell.get('cell_type') == 'code'
              and 'class NotebookTrainingDashboard' in ''.join(cell.get('source', []))
          )
          source = ''.join(target['source'])
          duplicate = '''    return None


def notebook_print(*args, **kwargs) -> None:
    with NOTEBOOK_OUTPUT_LOCK:
        print(*args, **kwargs)


def _device_sort_key(device: str):
'''
          replacement = '''    return None


def _device_sort_key(device: str):
'''
          if source.count('def notebook_print(*args, **kwargs) -> None:') != 2:
              raise RuntimeError('expected exactly two notebook_print definitions before cleanup')
          if duplicate not in source:
              raise RuntimeError('duplicate helper block not found')
          source = source.replace(duplicate, replacement, 1)
          target['source'] = source.splitlines(keepends=True)
          path.write_text(json.dumps(notebook, indent=1) + '\n', encoding='utf-8')
          reloaded = json.loads(path.read_text(encoding='utf-8'))
          verified = ''.join(target['source'])
          ast.parse(verified)
          assert verified.count('def notebook_print(*args, **kwargs) -> None:') == 1
          assert len(reloaded['cells']) == len(notebook['cells'])
          print('Duplicate notebook helper removed and syntax verified.')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/remove-duplicate-notebook-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NeurCross_Training.ipynb .github/workflows/remove-duplicate-notebook-helper.yml
          git commit -m "Remove duplicate notebook output helper"
          git push origin HEAD:agent/clean-notebook-progress
